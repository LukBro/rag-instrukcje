name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read # gitleaks-action pobiera listę commitów PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pełna historia dla gitleaks

      # Skan sekretów w commitach (BRO-39) — część wymaganego checku rspec.
      # Konto osobiste: GITLEAKS_LICENSE niepotrzebny. Wersja jak w hooku pre-commit.
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
