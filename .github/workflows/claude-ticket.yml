name: Claude ticket

# Zlecenie zgłoszenia z Linear agentowi (BRO-33): Actions → "Claude ticket" → Run workflow.
# Claude czyta zgłoszenie z Linear (MCP, tylko narzędzia odczytu), pracuje na gałęzi
# bro-<numer>-… i otwiera PR. Scalenie zawsze robi człowiek.

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Numer zgłoszenia z Linear, np. BRO-11"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write # token aplikacji Claude (push i PR idą przez nią, więc uruchamiają CI)

concurrency:
  group: claude-ticket-${{ inputs.ticket }}
  cancel-in-progress: false

jobs:
  claude-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development
    steps:
      - name: Validate ticket id
        env:
          TICKET: ${{ inputs.ticket }}
        run: |
          if [[ ! "$TICKET" =~ ^BRO-[0-9]+$ ]]; then
            echo "::error::Nieprawidłowy numer zgłoszenia: '$TICKET' (oczekiwano np. BRO-11)"
            exit 1
          fi
          echo "Zgłoszenie: $TICKET"

      # Zawsze od main, także gdy workflow jest testowany z innej gałęzi (--ref),
      # żeby PR Claude nie zawierał zmian z tej gałęzi.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Zaimplementuj zgłoszenie ${{ inputs.ticket }} z Linear.

            1. Przeczytaj zgłoszenie narzędziem mcp__linear__get_issue (id: ${{ inputs.ticket }}) i jego komentarze (mcp__linear__list_comments). Zakres i kryteria akceptacji ze zgłoszenia są definicją „gotowe”.
               Jeśli narzędzia Linear są niedostępne albo zwracają błąd — podaj w podsumowaniu dokładny komunikat błędu i zakończ.
               Jeśli zgłoszenie nie ma etykiety „agent”, jest zamknięte albo niejasne — niczego nie zmieniaj, opisz powód w podsumowaniu i zakończ.
            2. Stosuj zasady z CLAUDE.md.
            3. Utwórz gałąź: `git checkout -b <numer małymi literami>-<krótki-opis>` (kebab-case, bez polskich znaków), np. `bro-41-readme-automatyzacja`.
            4. Wprowadź zmiany. Pliki przenoś `git mv`, usuwaj `git rm` (zachowuje historię i oszczędza tury). Uruchom `bundle exec rspec` i napraw błędy.
               Uprawnienia (każde odrzucone wywołanie zjada turę):
               - z poleceń, które coś zmieniają albo uruchamiają kod, dozwolone są tylko: `git checkout -b/add/mv/rm/commit/push`, `bundle exec rspec`, `bin/rails docs:lint`, `bin/rails -T`,
               - nie próbuj `bundle install/update/check`, `gem`, `ruby`, `python`, `bin/rails runner/console`, `mkdir`, `cp`, zapisu do `/tmp` — zostaną odrzucone; pliki i katalogi twórz narzędziem `Write`,
               - pliki spoza repozytorium (np. źródła gemów) czytaj narzędziami `Read`, `Glob`, `Grep`, nie przez `sed`/`cat`/`find`,
               - jeśli blokuje cię zależność albo środowisko (gem, wersja, konfiguracja), nie obchodź tego: zrób commit i push tego, co działa, otwórz PR i opisz blokadę z dokładnym komunikatem błędu.
               Wczesny push: gdy tylko `bundle exec rspec` po raz pierwszy przechodzi z nowymi zmianami, zrób commit i `git push -u origin <gałąź>`; kolejne poprawki jako następne commity. Przekroczenie limitu tur nie może skasować pracy.
            5. `git add` zmienionych plików, `git commit -m "${{ inputs.ticket }}: <opis>"`, `git push -u origin <gałąź>`.
            6. Otwórz PR narzędziem mcp__github__create_pull_request (owner: ${{ github.repository_owner }}, repo: ${{ github.event.repository.name }}, base: main):
               - tytuł: `${{ inputs.ticket }}: <tytuł zgłoszenia>`,
               - opis zaczyna się od `Fixes [${{ inputs.ticket }}](https://linear.app/browarek/issue/${{ inputs.ticket }})`,
               - potem lista kryteriów akceptacji: [x] tylko przy tych, które faktycznie sprawdziłeś; przy pozostałych [ ] i krótko dlaczego,
               - bez stopki „Generated with Claude Code”.
          # Linear MCP musi być inline JSON: akcja scala --mcp-config tylko w tej postaci,
          # ścieżkę do pliku pomija, gdy dodaje własne serwery. Klucz z sekretu (maskowany w logach).
          # --max-turns to bezpiecznik przed zapętleniem, nie budżet pracy: BRO-14 lokalnie 93 tury,
          # zgłoszenia w podobnych projektach 230–330 wywołań. Czas i koszt ogranicza timeout-minutes
          # (~80 tur ≈ 8 min), a wczesny push chroni pracę przy przekroczeniu (BRO-43).
          claude_args: |
            --max-turns 250
            --mcp-config '{"mcpServers":{"linear":{"type":"http","url":"https://mcp.linear.app/mcp","headers":{"Authorization":"Bearer ${{ secrets.LINEAR_API_KEY }}"}}}}'
            --allowedTools "mcp__linear__get_issue,mcp__linear__list_comments,mcp__github__create_pull_request,Read,Edit,Write,Glob,Grep,Bash(git checkout -b:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git mv:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*),Bash(bundle exec rspec:*),Bash(bin/rails docs:lint:*),Bash(bin/rails -T:*)"

      # Pełny log Claude jest ukryty (publiczne repo). W podsumowaniu przebiegu tylko:
      # stan serwerów MCP, wywołane narzędzia (bez argumentów i wyników), odrzucone wywołania
      # (nazwa + początek polecenia) i końcowy komunikat.
      - name: Summary
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "## Claude ticket: ${{ inputs.ticket }}"
            echo "### Serwery MCP"
            jq -r '.[] | select(.type == "system" and .subtype == "init") | .mcp_servers[]? | "- \(.name): \(.status)"' "$EXECUTION_FILE"
            echo "### Wywołane narzędzia"
            jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name] | group_by(.) | .[] | "- \(.[0]) ×\(length)"' "$EXECUTION_FILE"
            echo "### Odrzucone narzędzia"
            jq -r '.[] | select(.type == "result") | (.permission_denials // []) as $d | if ($d | length) == 0 then "- (brak)" else $d[] | "- \(.tool_name)" + (if (.tool_input.command? | type) == "string" then ": \(.tool_input.command | gsub("\\s+"; " ") | .[0:60])" else "" end) end' "$EXECUTION_FILE"
            echo "### Przebieg"
            jq -r '.[] | select(.type == "result") | "- status: \(.subtype), tury: \(.num_turns), czas: \((.duration_ms // 0) / 1000 | floor) s"' "$EXECUTION_FILE"
            echo "### Wynik"
            jq -r '.[] | select(.type == "result") | .result // "(brak)"' "$EXECUTION_FILE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
